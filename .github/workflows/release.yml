name: Release local VM files

# Publishes the carrier that a successful `Build local VM image` run already built twice and compared, as a GitHub
# release. It rebuilds nothing: it downloads that run's `local-vm-carrier` artifact, checks every file against the
# run's own SHA256SUMS, and attaches them. Run by hand with the run id; a push never publishes. The release is the only
# thing that carries these files out of the repository; the backend image build downloads it and checks every file
# against the hash it pins for manifest.json.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Id of a successful "Build local VM image" run on main'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Check the run is the build, on main, and succeeded
        run: |
          set -e
          case "$RUN_ID" in ''|*[!0-9]*) echo "::error::run_id must be a number"; exit 1;; esac
          IFS=$'\t' read -r name branch conclusion sha < <(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,headBranch,conclusion,headSha -q '[.workflowName,.headBranch,.conclusion,.headSha]|@tsv')
          echo "run $RUN_ID: $name on $branch = $conclusion at $sha"
          test "$name" = "Build local VM image" && test "$branch" = main && test "$conclusion" = success || { echo "::error::not a successful build run on main"; exit 1; }
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"
      - name: Download the carrier that run built
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name local-vm-carrier --dir carrier
      - name: Create the release
        run: |
          set -e
          (cd carrier && sha256sum -c SHA256SUMS)
          tag="vm-${SOURCE_SHA::12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $tag already exists"; exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "Local VM files $tag" \
            --notes "Built from $SOURCE_SHA by run $RUN_ID (built twice and compared: identical). manifest.json names every file by sha256; the backend pins the hash of manifest.json." \
            carrier/*
